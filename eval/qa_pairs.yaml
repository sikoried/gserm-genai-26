- id: wiki-022
  question: What is the SI unit for luminance?
  reference_answer: The SI unit for luminance is candela per square metre (cd/m²).
  difficulty: easy
  type: factoid
  source_article: Luminance
- id: wiki-023
  question: How does the luminance of the output compare to the input in an ideal
    optical system?
  reference_answer: In an ideal optical system, the luminance at the output is the
    same as the input luminance.
  difficulty: medium
  type: factoid
  source_article: Luminance
- id: wiki-024
  question: What is the relationship between luminance and illuminance for a reflecting
    surface?
  reference_answer: The luminance of a reflecting surface is related to the illuminance
    it receives through the integral of luminous exitance over all emission directions.
  difficulty: hard
  type: multi-hop
  source_article: Luminance
