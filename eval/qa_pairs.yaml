- id: wiki-028
  question: What are the three symbols used in the Mayan numeral system?
  reference_answer: Zero (a shell), one (a dot), and five (a bar).
  difficulty: easy
  type: factoid
  source_article: Maya numerals
- id: wiki-029
  question: How is the number 429 represented in the Mayan numeral system using powers
    of twenty?
  reference_answer: One dot above one dot above four dots and a bar, or (1×20²) +
    (1×20¹) + 9 = 429.
  difficulty: hard
  type: factoid
  source_article: Maya numerals
- id: wiki-030
  question: How does the 'modified vigesimal' system in the Maya calendar differ from
    a pure base-20 system?
  reference_answer: The second position uses digits up to 17, and the third position's
    place value is 18×20 (360) instead of 20×20 (400).
  difficulty: medium
  type: comparison
  source_article: Maya numerals
