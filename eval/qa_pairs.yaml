- id: wiki-001
  question: What is the official name of the Benedictines?
  reference_answer: The Order of Saint Benedict (OSB).
  difficulty: easy
  type: factoid
  source_article: Benedictines
- id: wiki-002
  question: How are the Benedictines organized, and what role does the Abbot Primate
    serve?
  reference_answer: They are organized as autonomous monasteries, and the Abbot Primate
    represents them to the Vatican and the world.
  difficulty: medium
  type: multi-hop
  source_article: Benedictines
- id: wiki-003
  question: Which monastery was the first founded by Benedict of Nursia, and what
    significant event led to the spread of Benedictine monasticism?
  reference_answer: The monastery at Subiaco in Italy was the first, and the sack
    of Monte Cassino by the Lombards around 580 led to the diffusion of Benedictine
    monasticism.
  difficulty: hard
  type: multi-hop
  source_article: Benedictines
- id: wiki-004
  question: What is the temperature of absolute zero in Celsius and Fahrenheit?
  reference_answer: Absolute zero is −273.15°C and −459.67°F.
  difficulty: easy
  type: factoid
  source_article: Absolute zero
- id: wiki-005
  question: Why can absolute zero not be reached using only thermodynamic means?
  reference_answer: Because the temperature of the substance being cooled approaches
    the temperature of the cooling agent asymptotically, and a system at absolute
    zero still possesses quantum mechanical zero-point energy.
  difficulty: medium
  type: factoid
  source_article: Absolute zero
- id: wiki-006
  question: How do the entropy and enthalpy of a cooled ideal gas behave at absolute
    zero?
  reference_answer: At absolute zero, the enthalpy and entropy of a cooled ideal gas
    reach their minimum value, taken as zero kelvin.
  difficulty: hard
  type: multi-hop
  source_article: Absolute zero
- id: wiki-007
  question: What are the three core traits of Erlang processes as summarized by Joe
    Armstrong in his PhD thesis?
  reference_answer: Processes are strongly isolated, message passing is the only way
    for processes to interact, and processes share no resources.
  difficulty: hard
  type: multi-hop
  source_article: Erlang (programming language)
- id: wiki-008
  question: When was Erlang first released as free and open-source software?
  reference_answer: '1998'
  difficulty: easy
  type: factoid
  source_article: Erlang (programming language)
- id: wiki-009
  question: What was the name of the virtual machine developed for Erlang in 1992,
    and what did it compile Erlang to?
  reference_answer: The BEAM virtual machine, which compiles Erlang to C.
  difficulty: medium
  type: factoid
  source_article: Erlang (programming language)
