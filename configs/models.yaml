# Models available for comparison, with how each accepts reasoning control.
#
# reasoning: how a reasoning effort is passed to the proxy for this model —
#   effort  → top-level `reasoning_effort` parameter (Mistral family)
#   nested  → nested `reasoning: {effort: ...}` body (gpt-oss)
#   (omit)  → the model has no controllable reasoning
# efforts: the effort values to offer for this model (omit/empty when not controllable)
models:
  - id: mistralai/Mistral-Medium-3.5-128B
    label: Mistral Medium 3.5 (128B)
    reasoning: effort
    efforts: [high]
  - id: mistralai/Mistral-Small-3.2-24B-Instruct-2506
    label: Mistral Small 3.2 (24B)
    reasoning: effort
    efforts: [high]
  - id: mistralai/Magistral-Small-2509
    label: Magistral Small (2509)
  - id: openai/gpt-oss-120b
    label: GPT-OSS 120B
    reasoning: nested
    efforts: [low, medium, high]
  - id: Qwen/Qwen3.6-35B-A3B-NVFP4
    label: Qwen3.6 35B A3B
